<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decyzja do podjęcia</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f3; --surface: #ffffff; --text: #1d1d1b; --muted: #5a5a55; --line: #dcdcd5;
  --accent: #2457c5; --accent-bg: #e8effc; --on-accent: #ffffff;
  --ok: #14702d; --ok-bg: #e4f4e8; --warn: #8a5a00; --warn-bg: #fcf0d6; --bad: #b3261e; --bad-bg: #fbe7e5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #141416; --surface: #1c1c20; --text: #ececea; --muted: #a3a39d; --line: #34343a;
    --accent: #8db3ff; --accent-bg: #1d2a45; --on-accent: #0b1220;
    --ok: #5fd37a; --ok-bg: #16301d; --warn: #f0c15a; --warn-bg: #3a2d10; --bad: #ff8a80; --bad-bg: #3d1c1a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141416; --surface: #1c1c20; --text: #ececea; --muted: #a3a39d; --line: #34343a;
  --accent: #8db3ff; --accent-bg: #1d2a45; --on-accent: #0b1220;
  --ok: #5fd37a; --ok-bg: #16301d; --warn: #f0c15a; --warn-bg: #3a2d10; --bad: #ff8a80; --bad-bg: #3d1c1a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 4px; }
h2 { font-size: 1.1rem; margin: 28px 0 8px; }
h3 { font-size: 1rem; margin: 12px 0 6px; }
p { margin: 0 0 8px; }
ul, ol { margin: 0 0 8px; padding-left: 20px; }
li { margin-bottom: 4px; }
h1, h2, h3, p, li, dd, td, th, legend, summary, textarea, .chip { overflow-wrap: anywhere; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.lead { font-size: 1.1rem; }
.card, fieldset, details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0 0 12px; min-width: 0; }
.card h3 { margin-top: 0; }
.rec { border-left: 4px solid var(--accent); }
legend { font-weight: 600; padding: 0 4px; }
dl { margin: 0; }
dt { color: var(--muted); font-size: .85rem; margin-top: 8px; }
dd { margin: 0; }
.chip { display: inline-block; border: 1px solid currentColor; border-radius: 999px; padding: 1px 10px; font-size: .85rem; font-weight: 600; }
.ok { color: var(--ok); background: var(--ok-bg); }
.warn { color: var(--warn); background: var(--warn-bg); }
.bad { color: var(--bad); background: var(--bad-bg); }
.acc { color: var(--accent); background: var(--accent-bg); }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 6px 14px; margin: 4px 8px 4px 0; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
.pill:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.pill:focus-within, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.you { background: var(--accent-bg); border-radius: 6px; padding: 6px 8px; }
table { width: 100%; border-collapse: collapse; background: var(--surface); }
th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: .85rem; }
summary { cursor: pointer; font-weight: 600; }
textarea { width: 100%; min-height: 96px; padding: 10px; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
button { min-height: 44px; padding: 8px 24px; margin: 8px 12px 0 0; font: inherit; font-weight: 600; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
@media (max-width: 600px) {
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { padding: 8px; border-bottom: 1px solid var(--line); }
  td { border: 0; padding: 2px 0; }
  td::before { content: attr(data-label); display: block; color: var(--muted); font-size: .8rem; }
}
</style>
</head>
<body>
<main id="app"><noscript>Ta strona wymaga JavaScriptu.</noscript></main>
<script type="application/json" id="data">{"template":"REPLACE_ME"}</script>
<script>
(() => {
  const app = document.getElementById("app");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; };
  const put = (parent, ...kids) => { kids.forEach(k => { if (k) parent.appendChild(k); }); return parent; };
  const list = x => (Array.isArray(x) ? x : []);
  const str = x => (x == null ? "" : String(x));
  const fail = msg => { app.textContent = ""; app.appendChild(el("p", "card bad", msg)); };
  const anchor = (label, url) => {
    if (typeof url !== "string" || !/^https:\/\//i.test(url)) return null;
    const a = el("a", null, label); a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; return a;
  };
  const ul = (items, tag) => { const u = el(tag || "ul"); list(items).forEach(t => u.appendChild(el("li", null, t))); return u; };
  const section = title => { const s = el("section"); s.appendChild(el("h2", null, title)); app.appendChild(s); return s; };
  const chip = (cls, icon, word) => {
    const c = el("span", "chip " + cls), i = el("span", null, icon + " ");
    i.setAttribute("aria-hidden", "true");
    return put(c, i, el("span", null, word));
  };
  const REV = { easy: ["ok", "↺", "Łatwo"], costly: ["warn", "⚠", "Kosztownie"], none: ["bad", "✕", "Nie da się"] };

  let data;
  try { data = JSON.parse(document.getElementById("data").textContent); }
  catch (e) { return fail("Błędne dane JSON: " + e.message); }
  if (!data || typeof data !== "object" || data.template === "REPLACE_ME") return fail("Szablon bez danych: podmień blok JSON.");
  app.textContent = "";

  const picked = [], decs = list(data.decisions);
  let box = null;
  const sentence = () => {
    const choices = decs.map((d, i) => (i + 1) + " " + picked[i]).join(", ");
    const t = str(data.reply && data.reply.template) || "{choices}";
    return t.includes("{choices}") ? t.replace("{choices}", () => choices) : t + " " + choices;
  };
  const refresh = () => { if (box) box.value = sentence(); };

  put(app, put(el("header"), el("h1", null, data.title || "Decyzja"), el("p", "muted", "Aktualizacja: " + (str(data.updated) || "brak daty"))));
  put(section("Pytanie"), el("p", "lead", data.question));

  const rec = data.recommendation || {};
  put(section("Rekomendacja"), put(el("div", "card rec"), el("p", null, rec.text), ul(rec.reasons)));

  const opts = list(data.options);
  if (opts.length) {
    const s = section("Opcje");
    opts.forEach(o => {
      const h = el("h3", null, str(o.name) + " ");
      if (o.recommended) h.appendChild(chip("acc", "★", "Polecana"));
      const dl = el("dl");
      [["Co to jest", o.what], ["Co daje", o.gives], ["Co kosztuje albo co oddajesz", o.costs], ["Co zmienia się dla Ciebie", o.changes]]
        .forEach(([k, v]) => { if (v) put(dl, el("dt", null, k), el("dd", null, v)); });
      const r = REV[o.reversibility] || ["", "?", str(o.reversibility) || "brak danych"];
      put(dl, el("dt", null, "Odwracalność"), put(el("dd"), chip(r[0], r[1], r[2])));
      s.appendChild(put(el("div", "card" + (o.recommended ? " rec" : "")), h, dl));
    });
    const crit = list(data.criteria);
    if (crit.length) {
      const hr = el("tr"), tb = el("tbody");
      ["Opcja", ...crit].forEach(c => hr.appendChild(el("th", null, c)));
      opts.forEach(o => {
        const tr = el("tr");
        [o.name, ...crit.map((_, i) => list(o.ratings)[i])].forEach((v, i) => {
          const td = el("td", null, str(v));
          td.setAttribute("data-label", i ? str(crit[i - 1]) : "Opcja");
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      s.appendChild(put(el("table"), put(el("thead"), hr), tb));
    }
  }

  if (decs.length) {
    const s = section("Decyzje do podjęcia");
    decs.forEach((d, i) => {
      const choices = list(d.choices).length ? list(d.choices).map(str) : ["tak", "nie"];
      picked[i] = choices.includes(d.advice) ? d.advice : choices[0];
      const f = put(el("fieldset"), el("legend", null, (i + 1) + ". " + str(d.name)));
      if (d.question) f.appendChild(el("p", null, d.question));
      choices.forEach(c => {
        const inp = el("input");
        inp.type = "radio"; inp.name = "d" + i; inp.checked = c === picked[i];
        inp.addEventListener("change", () => { picked[i] = c; refresh(); });
        f.appendChild(put(el("label", "pill"), inp, el("span", null, c + (c === d.advice ? " · rada" : ""))));
      });
      if (d.otherwise) f.appendChild(el("p", "muted", "Przy innym wyborze: " + d.otherwise));
      s.appendChild(f);
    });
  }

  const steps = list(data.steps);
  if (steps.length) {
    const ol = el("ol");
    steps.forEach(st => {
      const li = el("li", st.you ? "you" : null);
      if (st.you) put(li, chip("acc", "→", "Twój krok"), el("span", null, " "));
      ol.appendChild(put(li, el("span", null, (st.who ? st.who + ": " : "") + str(st.text))));
    });
    put(section("Co się stanie po wyborze"), ol);
  }

  const risks = list(data.risks), unk = list(data.unknowns);
  if (risks.length || unk.length) {
    const s = section("Ryzyka i niewiadome");
    if (risks.length) put(s, el("h3", null, "Najważniejsze ryzyka"), ul(risks));
    if (unk.length) put(s, el("h3", null, "Niewiadome"), ul(unk));
  }

  const reply = section("Jak odpowiedzieć");
  box = el("textarea"); box.readOnly = true; box.rows = 3; box.setAttribute("aria-label", "Gotowa odpowiedź");
  const btn = el("button", null, "Kopiuj"), msg = el("span", "muted");
  btn.type = "button"; msg.setAttribute("role", "status");
  const done = ok => { msg.textContent = ok ? "Skopiowano." : "Nie udało się skopiować: zaznacz tekst i skopiuj ręcznie."; };
  const fallback = () => {
    box.focus(); box.select(); box.setSelectionRange(0, box.value.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    done(ok);
  };
  btn.addEventListener("click", () => {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(() => done(true), fallback);
    else fallback();
  });
  put(reply, el("p", "muted", "Wklej to zdanie w czacie albo napisz „wszystko jak radzisz”. Strona niczego nie wysyła."), box, btn, msg);
  refresh();

  const det = list(data.details), more = data.link ? anchor(str(data.link.label) || "Pełna propozycja", data.link.url) : null;
  if (det.length || more) {
    const s = section("Szczegóły");
    det.forEach(d => s.appendChild(put(el("details"), el("summary", null, d.title), el("p", null, d.text))));
    if (more) put(s, put(el("p"), more));
  }
})();
</script>
</body>
</html>
